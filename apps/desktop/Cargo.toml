[package]
name = "nemuribeat"
version.workspace = true
edition.workspace = true

[dependencies]
shared-types = { path = "../../crates/shared-types" }
sensor-core = { path = "../../crates/sensor-core" }
sensor-ble = { path = "../../crates/sensor-ble" }
physio-core = { path = "../../crates/physio-core" }
feature-engine = { path = "../../crates/feature-engine" }
sleep-engine = { path = "../../crates/sleep-engine" }
storage = { path = "../../crates/storage" }
osc-vrchat = { path = "../../crates/osc-vrchat" }
api = { path = "../../crates/api" }
ipc = { path = "../../crates/ipc" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_plot = "0.34"
rosc = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

uuid.workspace = true
directories = "6"
chrono = "0.4"

sensor-pulsoid = { path = "../../crates/sensor-pulsoid" }

[build-dependencies]
winresource = "0.1"
